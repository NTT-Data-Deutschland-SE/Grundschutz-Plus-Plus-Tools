function exportAP(){
    const ts=new Date().toISOString(),au=crypto.randomUUID();const cids=[...S.allCids].filter(c=>!S.excluded.has(c)).sort();
    L.info(`Assessment Plan wird erzeugt (${cids.length} Controls im Scope)`);
    if(!cids.length){L.err('AP-Export abgebrochen: keine Controls im Prüf-Scope');return alert('Keine Controls im Prüf-Scope — include-controls wäre leer (Schema-Verstoß).')}
    const byM={};cids.forEach(c=>{(S.methods.get(c)||new Set(['EXAMINE'])).forEach(m=>{if(!byM[m])byM[m]={uuid:crypto.randomUUID(),cids:[]};byM[m].cids.push(c)})});
    const acts=Object.entries(byM).map(([m,a])=>({uuid:a.uuid,title:`${m}-Prüfung`,description:`${m} für ${a.cids.length} Controls.`,props:[{name:"method",ns:"http://csrc.nist.gov/ns/oscal",value:m}],"related-controls":{"control-selections":[{"include-controls":a.cids.map(c=>({"control-id":c}))}]}}));
    // Pin-Muster (Grundregel 8): import-ssp als Fragment auf eine back-matter-Resource;
    // die Katalog-Resource dokumentiert, gegen welchen Katalogstand geprüft wird.
    const sspResUuid=crypto.randomUUID();
    const ap={"assessment-plan":{uuid:crypto.randomUUID(),metadata:{title:S.meta.title||'AP',version:S.meta.version||'1.0.0',"last-modified":ts,"oscal-version":"1.2.2",roles:[{id:"assessor",title:"Assessor"},{id:"system-owner",title:"System Owner"}]},"import-ssp":{href:`#${sspResUuid}`},"reviewed-controls":{"control-selections":[{"include-controls":cids.map(c=>({"control-id":c}))}]},"back-matter":{resources:[{uuid:sspResUuid,title:`System Security Plan (${S.sspFilename||'SSP'})`,rlinks:[{href:S.sspFilename||'SSP.json'}]},pinnedCatalogResource()]}}};
    if(S.meta.desc)ap["assessment-plan"].metadata.remarks=S.meta.desc;
    if(S.assessor.name){ap["assessment-plan"].metadata.parties=[{uuid:au,type:S.assessor.type,name:S.assessor.name}];if(S.assessor.email)ap["assessment-plan"].metadata.parties[0]["email-addresses"]=[S.assessor.email];ap["assessment-plan"].metadata["responsible-parties"]=[{"role-id":"assessor","party-uuids":[au]}]}
    if(acts.length)ap["assessment-plan"]["local-definitions"]={activities:acts};
    const tc=[];if(S.terms.roe)tc.push({name:"rules-of-engagement",prose:S.terms.roe});if(S.terms.disclosures)tc.push({name:"disclosures",prose:S.terms.disclosures});if(S.terms.methodology)tc.push({name:"methodology",prose:S.terms.methodology});if(tc.length)ap["assessment-plan"]["terms-and-conditions"]={parts:tc};
    ap["assessment-plan"]["assessment-subjects"]=[{type:"component",description:"Systemkomponenten","include-all":{}}];
    ap["assessment-plan"]["assessment-assets"]={"assessment-platforms":[{uuid:crypto.randomUUID(),title:"Assessment-Plattform"}]};
    if(S.dateStart||S.dateEnd||S.tasks.length){const t=[];if(S.dateStart&&S.dateEnd)t.push({uuid:crypto.randomUUID(),type:"action",title:"Assessment-Durchführung",timing:{"within-date-range":{start:`${S.dateStart}T00:00:00Z`,end:`${S.dateEnd}T23:59:59Z`}},"associated-activities":Object.values(byM).map(a=>({"activity-uuid":a.uuid,subjects:[{type:"component","include-all":{}}]}))});S.tasks.forEach(tk=>t.push({uuid:tk.uuid,type:tk.type,title:tk.title}));if(t.length)ap["assessment-plan"].tasks=t}
    L.ok(`Assessment Plan erzeugt: ${cids.length} Controls, ${acts.length} Aktivität(en), Katalog-Pin ${GPP_CATALOG_PIN_COMMIT.slice(0,12)}…`);
    dl(ap,`${sn()}_AP.json`);autoSave();
    // zusätzlich in den gemeinsamen Artefaktbestand (Übersicht in index.html)
    gppArtefacts.save({stage:'assess',kind:'ap',tool:GPP_TOOL_ID,
        title:`${sn()} — Assessment Plan`,filename:`${sn()}_AP.json`,data:ap})
        .catch(e=>L.warn('Artefakt nicht abgelegt: '+e.message));
}

function exportAR(){
    const ts=new Date().toISOString();const cids=[...S.allCids].filter(c=>!S.excluded.has(c)).sort();
    L.info(`Assessment Results werden erzeugt (${cids.length} Controls im Scope)`);
    const obs=[],fin=[],rsk=[];
    
    cids.forEach(c=>{
        const f=S.findings.get(c);
        if(!f||!f.status)return;
        
        const comps = [];
        S.compGroups.forEach((ctrlMap, cuuid) => {
            if(cuuid !== '__none' && ctrlMap.has(c)) {
                comps.push({uuid: cuuid, title: S.compMeta.get(cuuid)?.title || cuuid});
            }
        });

        if (comps.length === 0) {
            addTriplet(c, f, null);
        } else {
            comps.forEach(comp => {
                addTriplet(c, f, comp);
            });
        }

        function addTriplet(cid, finding, comp) {
            let ou=null;
            if(finding.observation){
                ou=crypto.randomUUID();
                const meth=[...(S.methods.get(cid)||[])];
                obs.push({
                    uuid:ou,
                    title:`Beobachtung ${cid}${comp ? ' (' + comp.title + ')' : ''}`,
                    description:finding.observation,
                    methods:meth.length?meth:['EXAMINE'],
                    collected:ts,
                    ...(comp ? { subjects: [{ "subject-uuid": comp.uuid, type: "component", title: comp.title }] } : {})
                });
            }
            
            let ru=null;
            if(finding.risk&&finding.status==='not-satisfied'){
                ru=crypto.randomUUID();
                rsk.push({
                    uuid:ru,
                    title:`Risiko ${cid}${comp ? ' (' + comp.title + ')' : ''}`,
                    description:finding.risk,
                    statement:finding.risk,
                    status:"open"
                });
            }
            
            const fd={
                uuid:crypto.randomUUID(),
                title:`Befund ${cid}${comp ? ' (' + comp.title + ')' : ''}`,
                description:finding.remarks||`Bewertung ${cid}`,
                // target.status.state kennt nur satisfied|not-satisfied — "Sonstig" wird
                // als not-satisfied mit reason "other" abgebildet
                target:{type:"objective-id","target-id":cid,status:finding.status==='satisfied'?{state:'satisfied'}:{state:'not-satisfied',...(finding.status!=='not-satisfied'?{reason:'other'}:{})}}
            };
            
            if(ou)fd["related-observations"]=[{"observation-uuid":ou}];
            if(ru)fd["related-risks"]=[{"risk-uuid":ru}];
            fin.push(fd);
        }
    });

    // Detaillierte Risiken aus der SSP-Risikoanalyse (back-matter) als OSCAL-Risks übernehmen.
    const NS="http://bsi.bund.de/ns/grundschutz";
    S.sspRisks.forEach(r=>{
        const props=[];
        if(r.likelihood)props.push({name:"likelihood",ns:NS,value:r.likelihood});
        if(r.impact)props.push({name:"impact",ns:NS,value:r.impact});
        const oscalRisk={
            // uuid aus der SSP-Risikoanalyse nur übernehmen, wenn es ein valides v4/v5-UUID ist
            uuid:(typeof r.uuid==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[45][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(r.uuid))?r.uuid:crypto.randomUUID(),
            title:r.title||'Risiko',
            description:r.description||r.title||'Risiko aus SSP-Risikoanalyse',
            statement:r.threat||r.description||r.title||'Risiko aus SSP-Risikoanalyse',
            status:"open"
        };
        if(props.length)oscalRisk.props=props;
        const notes=[];
        if(r.targetComponent)notes.push('Betroffene Komponente: '+(S.compMeta.get(r.targetComponent)?.title||r.targetComponent));
        if(Array.isArray(r.mitigatingControls)&&r.mitigatingControls.length)notes.push('Mitigierende Controls: '+r.mitigatingControls.map(m=>m&&m.id).filter(Boolean).join(', '));
        // risk kennt kein remarks-Feld — Zusatzinfos in die description aufnehmen
        if(notes.length)oscalRisk.description=[oscalRisk.description,notes.join('\n')].filter(Boolean).join('\n\n');
        rsk.push(oscalRisk);
    });

    if(!fin.length){L.err('AR-Export abgebrochen: keine bewerteten Controls');return alert('Keine bewerteten Controls.')}
    L.debug(`AR-Bestandteile: ${fin.length} findings, ${obs.length} observations, ${rsk.length} risks (davon ${S.sspRisks.length} aus der SSP-Risikoanalyse)`);
    // Pin-Muster (Grundregel 8): import-ap als Fragment auf eine back-matter-Resource;
    // die Katalog-Resource dokumentiert, gegen welchen Katalogstand geprüft wurde.
    const apResUuid=crypto.randomUUID();
    const ar={"assessment-results":{uuid:crypto.randomUUID(),metadata:{title:`${sn().replace(/_/g,' ')} - Assessment Results`,version:S.meta.version||'1.0.0',"last-modified":ts,"oscal-version":"1.2.2"},"import-ap":{href:`#${apResUuid}`},results:[{uuid:crypto.randomUUID(),title:"Assessment-Ergebnis",description:'Ergebnisse',start:S.dateStart?`${S.dateStart}T00:00:00Z`:ts,end:S.dateEnd?`${S.dateEnd}T23:59:59Z`:ts,"reviewed-controls":{"control-selections":[{"include-controls":cids.map(c=>({"control-id":c}))}]},...(obs.length?{observations:obs}:{}),findings:fin,...(rsk.length?{risks:rsk}:{})}],"back-matter":{resources:[{uuid:apResUuid,title:`Assessment Plan (${sn()}_AP.json)`,rlinks:[{href:`${sn()}_AP.json`}]},pinnedCatalogResource()]}}};
    L.ok(`Assessment Results erzeugt: ${fin.length} Befunde, ${obs.length} Beobachtungen, ${rsk.length} Risiken`);
    dl(ar,`${sn()}_AR.json`);autoSave();
    gppArtefacts.save({stage:'assess',kind:'ar',tool:GPP_TOOL_ID,
        title:`${sn()} — Assessment Results`,filename:`${sn()}_AR.json`,data:ar})
        .catch(e=>L.warn('Artefakt nicht abgelegt: '+e.message));
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// --- BSI ED2023 Anforderungen (vorberechnet von Gpp-ai-tool, ohne Laufzeit-KI) ---
let ED23_MAP={};
const ED23_MAP_URL="https://raw.githubusercontent.com/NTT-Data-Deutschland-SE/Grundschutz-Plus-Plus-Tools/2ab904b0099f560a06a68950d2b47a8ad019571a/hilfsdateien/gpp_ed23_anforderungen.json";
function buildEd23MapFromOscal(doc){if(doc&&doc.gpp_ed23_anforderungen_map)return doc.gpp_ed23_anforderungen_map;const out={},mc=doc&&doc["mapping-collection"];if(!mc)return out;(mc.mappings||[]).forEach(mp=>(mp.maps||[]).forEach(m=>{const src=(m.sources||[])[0];if(!src)return;const cid=src["id-ref"];(m.targets||[]).forEach(t=>{const label=(t.props||[]).find(p=>p.name==="label"||p.name==="title");(out[cid]=out[cid]||[]).push({id:t["id-ref"],name:(label&&label.value)||"",begruendung:m.remarks||""})})}));return out}
async function loadED23Map(){try{const r=await fetch(gppSource('ed23-anforderungen',ED23_MAP_URL));if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();ED23_MAP=buildEd23MapFromOscal(d);L.ok(`BSI-ED23-Zuordnungen geladen: ${Object.keys(ED23_MAP).length} Controls`)}catch(e){console.warn('BSI ED23-Anforderungen nicht geladen:',e);L.warn('BSI-ED23-Anforderungen nicht geladen: '+shortErr(e.message));ED23_MAP={}}}
function renderED23Table(list){
    if(!list||!list.length)return '<p class="text-xs text-slate-500 italic">Keine passenden BSI ED23-Anforderungen hinterlegt.</p>';
    const rows=list.map(a=>`<tr class="border-b border-slate-700/50 align-top"><td class="py-1 pr-2 font-mono font-bold text-cyan-300 whitespace-nowrap">${esc(a.id)}</td><td class="py-1 pr-2 text-slate-200">${esc(a.name)}</td><td class="py-1 text-slate-400">${esc(a.begruendung||'')}</td></tr>`).join('');
    return `<table class="w-full text-xs border-collapse"><thead><tr class="text-left text-slate-500"><th class="py-1 pr-2">ID</th><th class="py-1 pr-2">Name der Anforderung</th><th class="py-1">Begründung</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function showED23(cid,rk){const box=document.getElementById('ed23-'+rk);if(!box)return;if(!box.classList.contains('hidden')){box.classList.add('hidden');return}box.innerHTML=renderED23Table(ED23_MAP[cid]);box.classList.remove('hidden')}
function sn(){return(S.meta.title||'System').replace(/[^a-zA-Z0-9äöüÄÖÜß\-]/g,'_').replace(/_+/g,'_')}
function dl(o,n){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json;charset=utf-8'}));a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a)}
function setSt(id,ok,txt){setPill(id,ok?'ok':'warn',`${ok?'◉':'◐'} ${esc(txt)}`)}
</script>
