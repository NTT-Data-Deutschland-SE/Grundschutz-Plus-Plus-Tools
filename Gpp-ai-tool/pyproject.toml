[project]
name = "gpp-ai-tool"
version = "5.0.0"
description = "Grundschutz++ OSCAL-Pipeline: ED23-Baustein-Profile, Mappings und KI-Anreicherung (Gemini 4 Argon)"
requires-python = ">=3.12"
dependencies = [
    # 2.30.1: automatic long-decode continuation; <3: Google's own advice.
    "google-genai>=2.30.1,<3",
    "jsonschema>=4.21",
    "regex>=2024.4",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["venv", ".venv", ".cache"]

[tool.ruff.lint]
# Bestand ist nicht ruff-sauber (Wildcard-Importe, lange Zeilen); nur harte Fehler gelten.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
