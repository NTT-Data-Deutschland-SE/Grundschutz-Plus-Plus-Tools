<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grundschutz++ OSCAL Tools · v1.0</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --bg-deep:      oklch(0.13 0.02 280);
      --bg-elev-1:    oklch(0.95 0.005 280 / 0.04);
      --bg-elev-2:    oklch(0.95 0.005 280 / 0.06);
      --bg-elev-3:    oklch(0.95 0.005 280 / 0.08);
      --border-1:     oklch(0.95 0.005 280 / 0.06);
      --border-2:     oklch(0.95 0.005 280 / 0.10);
      --text-primary: oklch(0.95 0.005 280);
      --text-secondary: oklch(0.75 0.02 280);
      --text-quiet:   oklch(0.55 0.02 280);
      --accent:       oklch(0.7 0.18 300);
      --accent-soft:  oklch(0.7 0.18 300 / 0.15);
      --accent-glow:  oklch(0.7 0.18 300 / 0.4);
      --green:        oklch(0.75 0.18 145);
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-deep); color: var(--text-primary);
    }
    ::selection { background: oklch(0.7 0.18 300 / 0.35); color: var(--text-primary); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* Aurora atmosphere */
    .aurora { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
    .aurora-1 {
      width: 600px; height: 600px; top: -200px; left: -100px;
      background: radial-gradient(circle, oklch(0.4 0.18 300 / .5), transparent 70%);
      filter: blur(60px);
    }
    .aurora-2 {
      width: 700px; height: 700px; bottom: -300px; right: -200px;
      background: radial-gradient(circle, oklch(0.4 0.16 240 / .4), transparent 70%);
      filter: blur(80px);
    }
    .noise {
      position: fixed; inset: 0; opacity: 0.03; pointer-events: none; z-index: 0;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="n"><feTurbulence baseFrequency="0.9"/></filter><rect width="100" height="100" filter="url(%23n)"/></svg>');
    }

    header, nav, .frame-wrap { position: relative; z-index: 1; }

    header {
      display: flex; align-items: center; gap: 12px;
      height: 62px; padding: 0 20px;
      background: var(--bg-elev-1);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-1);
    }
    header .brand { font-weight: 600; font-size: 0.95rem; white-space: nowrap; }
    header .brand span { color: var(--accent); }
    header .spacer { flex: 1; }
    .build-pill {
      font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.1em;
      color: var(--text-quiet); border: 1px solid var(--border-1);
      border-radius: 6px; padding: 2px 7px; white-space: nowrap;
    }
    header a.btn {
      color: var(--text-secondary); text-decoration: none;
      font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.06em;
      padding: 6px 11px; border: 1px solid var(--border-2); border-radius: 8px;
      white-space: nowrap; transition: all .15s ease;
    }
    header a.btn:hover {
      color: var(--text-primary); border-color: var(--accent);
      background: var(--bg-elev-2);
    }

    nav {
      display: flex; gap: 4px; padding: 8px 14px;
      background: var(--bg-elev-1);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-1);
      overflow-x: auto; scrollbar-width: thin;
    }
    nav button {
      flex: 0 0 auto; cursor: pointer;
      background: transparent; color: var(--text-secondary);
      border: 1px solid transparent; border-radius: 8px;
      padding: 7px 13px; font-size: 0.82rem; font-weight: 500;
      display: flex; align-items: center; gap: 8px; white-space: nowrap;
      transition: all .15s ease;
    }
    nav button:hover { color: var(--text-primary); background: var(--bg-elev-2); }
    nav button.active {
      color: var(--text-primary); background: var(--accent-soft);
      border-color: var(--border-2);
    }
    nav button.active .ico { color: var(--accent); }
    nav button .ico { font-size: 0.95rem; color: var(--text-quiet); transition: color .15s ease; }

    .frame-wrap { flex: 1; position: relative; background: var(--bg-deep); }
    iframe { width: 100%; height: 100%; border: 0; display: block; }

    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--bg-deep); color: var(--text-quiet);
      font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em;
      text-transform: uppercase; gap: 14px;
      transition: opacity .2s; pointer-events: none;
    }
    #loading.hidden { opacity: 0; }
    /* 1px hairline progress instead of a spinner */
    .progress-track {
      width: 180px; height: 1px; background: var(--border-2); overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 30%; background: var(--accent);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(430%); }
    }
  </style>
</head>
<body>
  <div class="aurora aurora-1"></div>
  <div class="aurora aurora-2"></div>
  <div class="noise"></div>

  <header>
    <div class="brand">◈ Grundschutz<span>++</span> OSCAL Tools</div>
    <span class="build-pill" id="build-pill"></span>
    <div class="spacer"></div>
    <a class="btn" id="open-standalone" href="#" target="_blank" rel="noopener" title="Aktuelle App in neuem Tab öffnen">↗ STANDALONE</a>
    <a class="btn" href="https://github.com/NTT-Data-Deutschland-SE/Grundschutz-Plus-Plus-Tools" target="_blank" rel="noopener">GitHub</a>
  </header>

  <nav id="tabs" aria-label="Apps"></nav>

  <div class="frame-wrap">
    <div id="loading">
      <span>Lade App…</span>
      <span class="progress-track"><span class="progress-fill"></span></span>
    </div>
    <iframe id="app-frame" title="App" src="about:blank"></iframe>
  </div>

  <script>
    // Workflow order: Explorer → Katalog/Profil-Erstellung → Modellierung → Umsetzung → Prüfung → Abarbeiten → Validierung.
    const APPS = [
      { id: "explorer",  icon: "⌕", label: "Explorer",         file: "GSpp-Viewer.html",               desc: "BSI Grundschutz++ Katalog-Explorer" },
      { id: "bsi2gpp",   icon: "◈", label: "BSI → G++ Profil",  file: "Baustein_2_Profile.html",        desc: "BSI-Baustein (PDF) → OSCAL G++ Profil" },
      { id: "c5oscal",   icon: "◇", label: "C5 → OSCAL",        file: "c5-oscal-converter.html",        desc: "BSI C5:2026 YAML → OSCAL Katalog (deterministisch, ohne KI)" },
      { id: "sspgen",    icon: "▣", label: "SSP-Generator",     file: "ssp_generator.html",             desc: "OSCAL Blaupausen & Risk Generator (G++)" },
      { id: "sspgened23",icon: "⬡", label: "SSP-Gen. ED23",     file: "ssp_generator_ed23.html",        desc: "OSCAL Blaupausen & Risk Generator (BSI Edition 2023)" },
      { id: "sspedit",   icon: "✎", label: "SSP-Editor",        file: "ssp_ausfuellen.html",            desc: "OSCAL SSP ausfüllen / Workspace" },
      { id: "pruefung",  icon: "◉", label: "Prüfung (AP/AR)",   file: "pruefung_ap_ar.html",            desc: "Assessment Plan & Results Generator" },
      { id: "poam",      icon: "◬", label: "POA&M",             file: "abarbeiten_POAM_generator.html", desc: "POA&M Generator – Feststellungen abarbeiten" },
      { id: "validator", icon: "◐", label: "OSCAL-Validator",   file: "oscal-schema-validator.html",    desc: "OSCAL-Artefakte gegen Schema & Regeln prüfen" },
    ];

    const APP_VERSION = "1.0";
    document.getElementById("build-pill").textContent = `build ${APP_VERSION}`;

    const nav = document.getElementById("tabs");
    const frame = document.getElementById("app-frame");
    const loading = document.getElementById("loading");
    const standalone = document.getElementById("open-standalone");

    APPS.forEach(app => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.id = app.id;
      b.title = app.desc;
      b.innerHTML = `<span class="ico">${app.icon}</span>${app.label}`;
      b.addEventListener("click", () => select(app.id, true));
      nav.appendChild(b);
    });

    function select(id, push) {
      const app = APPS.find(a => a.id === id) || APPS[0];
      [...nav.children].forEach(b => {
        const on = b.dataset.id === app.id;
        b.classList.toggle("active", on);
        if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
      });
      loading.classList.remove("hidden");
      frame.src = app.file;
      frame.title = app.desc;
      standalone.href = app.file;
      document.title = `${app.label} · Grundschutz++ OSCAL Tools · v${APP_VERSION}`;
      if (push && location.hash.slice(1) !== app.id) {
        history.replaceState(null, "", "#" + app.id);
      }
    }

    frame.addEventListener("load", () => {
      if (frame.src !== "about:blank") loading.classList.add("hidden");
    });

    window.addEventListener("hashchange", () => select(location.hash.slice(1) || APPS[0].id, false));
    select(location.hash.slice(1) || APPS[0].id, false);
  </script>
</body>
</html>
